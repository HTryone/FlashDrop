<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>点对点传输</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>点对点传输</h1>
      <p class="sub">大文件传输 · 服务器中转 · 断点续传</p>
      <div class="tabs">
        <button id="tabSend" class="tab active">发送</button>
        <button id="tabRecv" class="tab">接收</button>
      </div>
    </header>

    <!-- 发送视图 -->
    <section id="sendView">
      <div class="code-box">
        <div class="code-label">分享码（发给对方）</div>
        <div class="code-row">
          <span id="code" class="code">------</span>
          <button id="copyBtn" class="btn small">复制链接</button>
        </div>
        <div class="hint">对方在同一网络打开本页面，点「接收」粘贴此码即可；点「复制链接」可直接发对方一个能自动接收的地址。</div>
      </div>

      <section class="actions">
        <button id="pickFiles" class="btn">选择文件</button>
        <button id="pickDir" class="btn">选择文件夹</button>
        <input id="fileInput" type="file" multiple hidden />
        <input id="dirInput" type="file" webkitdirectory multiple hidden />
      </section>

      <section class="progress-summary">
        <div class="bar"><div id="totalBar" class="bar-fill"></div></div>
        <div id="totalText" class="muted">尚未选择文件</div>
      </section>

      <ul id="fileList" class="file-list"></ul>
    </section>

    <!-- 接收视图 -->
    <section id="recvView" style="display:none">
      <section class="actions">
        <input id="codeInput" class="code-input" placeholder="输入分享码" maxlength="12" />
        <button id="loadBtn" class="btn">获取文件</button>
      </section>
      <div id="msg" class="muted"></div>
      <div id="toolbar" class="toolbar" style="display:none">
        <button id="zipBtn" class="btn small">打包下载全部 (zip)</button>
      </div>
      <ul id="recvList" class="file-list"></ul>
    </section>
  </div>

  <script src="vendor/tus.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
