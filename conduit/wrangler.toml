name = "flashdrop-relay"
main = "src/index.js"
compatibility_date = "2024-09-23"

# 本地磁盘模式的中继 Worker：WebSocket 内存流转，不落盘。
# 部署后前端“本地直传”连 wss://<your-subdomain>.workers.dev/relay

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# 开启 Cloudflare Workers 日志（与 Dashboard 可观测性设置保持一致）
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
