name = "arkpulse-relay"
main = "src/index.js"
compatibility_date = "2024-09-23"

# 本地直传的中继 Worker：HTTP 流式内存转发，不落盘。
# 部署后前端"本地直传"连 https://<your-subdomain>.workers.dev/stream/:room

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# 开启 Cloudflare Workers 日志（与 Dashboard 可观测性设置保持一致）
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
