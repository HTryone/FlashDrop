<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>闪云 · 文档模块生成器（本地、零依赖）</title>
  <link rel="stylesheet" href="./ssjs/doc-style.css" />
<link rel="stylesheet" href="./ssjs/docs-gen.css">
</head>
<body>
<header>
  <h1>文档模块生成器</h1>
  <span class="sub">本地运行 · 零依赖 · 生成后把文件夹丢进 <code class="k">src/extensions/</code> 即可</span>
</header>

<div class="wrap">
  <!-- 左栏：上=模块，下=当前模块文档 -->
  <div class="left">
    <div class="panel-mods">
      <div class="bar"><span>模块</span></div>
      <div class="panel-btns">
        <button id="openDir">📂 导入模块</button>
        <button id="addMod">＋ 新建模块</button>
      </div>
      <div id="modList"></div>
    </div>
    <div class="panel-docs">
      <div class="cap">文档 · <span id="docModName">—</span></div>
      <div id="docList"></div>
      <button id="addDoc" class="new-doc">＋ 新建文档</button>
    </div>
  </div>

  <!-- 右栏：顶栏操作 + 模块信息 + 文档编辑 -->
  <div class="right">
    <div class="topbar">
      <span class="id" id="topId">未选择模块</span>
      <div class="acts">
        <button id="saveBtn">💾 保存</button>
        <button id="expOne" class="primary">📁 导出</button>
      </div>
    </div>
    <div class="editor-scroll">
      <div class="empty" id="emptyTip">← 左侧选择一个模块，或点「＋ 新建模块」</div>
      <div id="editor" style="display:none">
        <!-- 模块基本信息（始终在最上面）：标识 / 显示名 / 图标 三列 + 描述 -->
        <div class="mod-info">
          <div class="grid3">
            <div class="field"><label>模块标识（英文，用于目录名 / 网址 / 数据读取，唯一）</label><input id="mId" placeholder="posts" /></div>
            <div class="field"><label>显示名（左侧 / 选择页显示）</label><input id="mTitle" placeholder="项目动态" /></div>
            <div class="field"><label>图标（一个 emoji）</label><input id="mIcon" placeholder="📰" /></div>
          </div>
          <div class="field"><label>描述</label><input id="mDesc" placeholder="后端发布，前端只读展示" /></div>
        </div>

        <!-- 文档编辑区 -->
        <div id="docEdit" style="display:none">
          <div class="grid2" style="margin-bottom:10px">
            <div class="field"><label>文档总标题（目录里点的名字）</label><input id="dTitle" /></div>
            <div class="field"><label>日期（排序用 YYYY-MM-DD）</label><input id="dDate" placeholder="2026-08-13" /></div>
          </div>
          <div class="tabs">
            <button id="tabEdit" class="on">编辑</button>
            <button id="tabPrev">预览</button>
            <button id="insLink">🔗 插入跳转链接</button>
          </div>
          <div class="dnd-hint">💡 可直接把 <b>.md / .txt</b> 文件拖进下面的输入框（没选文档时拖入会新建一篇）</div>
          <textarea id="dMd" placeholder="在这里粘贴 / 写 Markdown…"></textarea>
          <div id="prevBox" class="preview doc-body" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="./ssjs/docs-gen.js"></script>
</body>
</html>
