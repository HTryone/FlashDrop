name = "arkpulse-tus"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 中转(tus) Worker：文件体存 R2，索引用 D1。全程云端、无本地磁盘、无本地数据库。
# 部署后前端"中转模式"连 https://<your-subdomain>.workers.dev/
# 中继(本地直传)另由 flashdrop-relay Worker 承载，本文件只管中转。

[[r2_buckets]]
binding = "R2_TRANSFERS"
bucket_name = "flashdrop-transfers"

[[d1_databases]]
binding = "DB"
database_name = "flashdrop-tus"
database_id = "77286df6-c1d9-4274-82cb-b95c7371ccfa"

[vars]
DEFAULT_TTL_HOURS = "24"
# R2 预签名 URL 所需凭证（git 自动部署只可靠读取 wrangler.toml [vars]，Dashboard 手填变量不保证挂到生产实例）。
# 注意：R2_SECRET_ACCESS_KEY 为敏感值，本应走 `wrangler secret`，但为打通链路先置于此；
# 上线稳定后请到 R2 轮换令牌并更新本值，或改用 wrangler secret 注入。
R2_ACCOUNT_ID = "da94b5e41f7c56ff2df7043718a53616"
R2_ACCESS_KEY_ID = "39305e4d3cbf6f41477be63a9aa479e6"
R2_SECRET_ACCESS_KEY = "aaaa2c322081e2f3e0b314dddc288b51b0b0b5d960df7838aa405863d31d3cad"

# 每小时跑一次 sweeper，清理 D1 中过期 24h 的 transfer/files/codes 记录。
# R2 文件体由 bucket 生命周期规则自动过期（已在 CF 控制台配置）。
[triggers]
crons = ["0 * * * *"]

# 开启 Cloudflare Workers 日志（与 Dashboard 可观测性设置保持一致）
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
