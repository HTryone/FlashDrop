name = "arkpulse-tus"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 中转(tus) Worker：文件体存 R2（凭 KV bucket_cfg S3 直连，无 wrangler 绑定），索引用 D1。
# 全程云端、无本地磁盘、无本地数据库。
# 部署后前端"中转模式"连 https://<your-subdomain>.workers.dev/
# 中继(本地直传)另由 flashdrop-relay Worker 承载，本文件只管中转。
#
# 全 KV 化（用户 2026-08-20 决定）：不再有 R2 绑定 / vars 密钥。
# 每桶凭证存 KV QUOTA_KV：
#   quota:buckets            = ["default", "bucket-a", ...]   （接入顺序，新桶 append 末尾）
#   quota:<id>:bucket_cfg    = {"accountId":..,"accessKeyId":..,"secretAccessKey":..,"bucketName":..}
#   quota:<id>:limit_bytes / quota:<id>:enabled
# 选桶规则：剩余最多优先；平局取配置靠前（接入顺序）。

[[kv_namespaces]]
binding = "QUOTA_KV"
id = "0bd6012810474adab71452ba35e9e994"

[[d1_databases]]
binding = "DB"
database_name = "flashdrop-tus"
database_id = "77286df6-c1d9-4274-82cb-b95c7371ccfa"

[vars]
DEFAULT_TTL_HOURS = "24"

# 每小时跑一次 sweeper，清理 D1 中过期 24h 的 transfer/files/codes 记录。
# R2 文件体由各桶生命周期规则自动过期（已在 CF 控制台配置）。
[triggers]
crons = ["0 * * * *"]

# 开启 Cloudflare Workers 日志（与 Dashboard 可观测性设置保持一致）
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
