<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ArkPulse · 启动中</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  background: #0b0e16;
  color: #e8edf7;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
}
.logo {
  width: 96px;
  height: 96px;
  border-radius: 22px;
  overflow: hidden;
}
.logo svg { width: 100%; height: 100%; display: block; }
.text {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid rgba(109, 139, 255, 0.18);
  border-top-color: #6d8bff;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
.hint {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.03em;
  color: rgba(232, 237, 247, 0.55);
  min-height: 18px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="logo">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" style="width:100%;height:100%;display:block">
    <defs>
      <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00D4FF"/>
        <stop offset="100%" stop-color="#7B2FBE"/>
      </linearGradient>
      <radialGradient id="glowA" cx="80%" cy="-6%" r="95%">
        <stop offset="0%" stop-color="#6D8BFF" stop-opacity="0.22"/>
        <stop offset="60%" stop-color="#6D8BFF" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowB" cx="-6%" cy="106%" r="90%">
        <stop offset="0%" stop-color="#38E1C8" stop-opacity="0.18"/>
        <stop offset="55%" stop-color="#38E1C8" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="200" height="200" fill="#0B0E16"/>
    <rect width="200" height="200" fill="url(#glowA)"/>
    <rect width="200" height="200" fill="url(#glowB)"/>
    <g transform="rotate(-90 100 100)">
      <circle cx="100" cy="100" r="62" fill="none" stroke="url(#mainGrad)" stroke-width="14" stroke-dasharray="296 94" stroke-linecap="round"/>
      <circle cx="145.1" cy="57.4" r="8" fill="url(#mainGrad)"/>
    </g>
    <circle cx="100" cy="100" r="42" fill="url(#mainGrad)"/>
  </svg>
</div>
<div class="text">ArkPulse</div>
<div class="spinner"></div>
<div class="hint" id="hint"></div>
<script>
(function () {
  var remote = window.__ARKPULSE_REMOTE__;
  var hint = document.getElementById('hint');
  var t0 = Date.now();
  var attempts = 0;
  var MIN_MS = 800; // 启动页至少停留，避免一闪而过

  function showHint(msg) { if (hint) hint.textContent = msg; }
  function go() { window.location.replace(remote); }

  // 探活远程前端：连上就跳转，连不上（离线/DNS失败）就显示「重试中」并持续重试。
  // 用 no-cors HEAD：网络通即 resolve（不关心返回内容），网络不通才 reject。
  function tryOnce() {
    attempts++;
    fetch(remote, { method: 'HEAD', cache: 'no-store', mode: 'no-cors' })
      .then(function () {
        var wait = Math.max(0, MIN_MS - (Date.now() - t0));
        setTimeout(go, wait);
      })
      .catch(function () {
        if (attempts < 40) {
          showHint('离线，正在重试… (' + attempts + ')');
          setTimeout(tryOnce, 1000);
        } else {
          go(); // 放弃等待，跳转以暴露错误页
        }
      });
  }

  if (!remote) { showHint('启动配置缺失'); return; }
  setTimeout(tryOnce, 300);
})();
</script>
</body>
</html>
