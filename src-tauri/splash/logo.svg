<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <defs>
    <!-- 品牌主渐变（蓝→紫） -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <!-- 深色模式光晕 A（对齐 body 右上蓝紫光斑 accent #6d8bff） -->
    <radialGradient id="glowA" cx="80%" cy="-6%" r="95%">
      <stop offset="0%" stop-color="#6D8BFF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6D8BFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 深色模式光晕 B（对齐 body 左下青光斑 accent-2 #38e1c8） -->
    <radialGradient id="glowB" cx="-6%" cy="106%" r="90%">
      <stop offset="0%" stop-color="#38E1C8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#38E1C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 0. 深色底：严格对齐 style.css 的 bg #0b0e16 加 body 双光晕 -->
  <rect width="200" height="200" fill="#0B0E16"/>
  <rect width="200" height="200" fill="url(#glowA)"/>
  <rect width="200" height="200" fill="url(#glowB)"/>

  <!-- 1. 框架：环（P2P 互联）+ 顶部缺口 + 缺口中央节点圆点（端点） -->
  <g transform="rotate(-90 100 100)">
    <circle cx="100" cy="100" r="62" fill="none" stroke="url(#mainGrad)" stroke-width="14"
            stroke-dasharray="296 94" stroke-linecap="round"/>
    <circle cx="145.1" cy="57.4" r="8" fill="url(#mainGrad)"/>
  </g>

  <!-- 2. 中心实心圆核：被传输的数据 / 连接核心，小尺寸永不糊 -->
  <circle cx="100" cy="100" r="42" fill="url(#mainGrad)"/>
</svg>
