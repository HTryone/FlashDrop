[package]
name = "arkpulse-android-fs"
version = "0.1.0"
description = "ArkPulse 安卓原生落盘/弹窗/亮屏桥接（独立插件，防 tauri android 重生成覆盖）"
authors = ["ArkPulse"]
edition = "2021"
rust-version = "1.77"
links = "arkpulse-android-fs"
build = "build.rs"

[lib]
name = "arkpulse_android_fs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
