[package]
name = "arkpulse"
version = "0.1.0"
description = "闪云 ArkPulse 桌面/移动端原生壳（Rust 接管大文件落盘）"
authors = ["ArkPulse"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# 安卓 IPC 不支持二进制 Raw 载荷（Tauri 官方限制），大块数据以 base64 传输（膨胀 1.33x，
# 远优于 JSON 数字数组的 3~4x）。桌面仍走 Raw 零膨胀，故此依赖仅服务安卓路径。
base64 = "0.22"
